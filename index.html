<style>
/* Layout: one phone-width app column. Navy brand, skyline photo bands, white cards, bilingual EN/AR labels, fixed 4-tab bar. */
:root {
  --navy: #0A3355; --btn: #0A3355; --on-btn: #FFFFFF; --head: #0A3355;
  --blue: #1774DD; --green: #068973; --amber: #D98A1A; --red: #E0313F; --purple: #A04FC9; --indigo: #5B60C2;
  --bg: #F3F6F9; --surface: #FFFFFF; --fg: #13283D; --muted: #6B7C8F; --line: #E2E8EE; --soft: #EEF3F8;
  --ok: #0B8A5F; --ok-bg: #DDF3EA; --warn-bg: #FCEFD9; --err-bg: #FCE3E5;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ar: "Noto Sans Arabic", "Inter", system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --btn: #1B5C96; --head: #CFE1F3; --bg: #08141F; --surface: #0F1F2E; --fg: #E6EEF6; --muted: #93A5B8; --line: #1F3348; --soft: #15293B;
  --ok: #3CC48F; --ok-bg: rgba(60,196,143,.15); --warn-bg: rgba(217,138,26,.18); --err-bg: rgba(224,49,63,.18); color-scheme: dark } }
:root[data-theme="dark"] {
  --btn: #1B5C96; --head: #CFE1F3; --bg: #08141F; --surface: #0F1F2E; --fg: #E6EEF6; --muted: #93A5B8; --line: #1F3348; --soft: #15293B;
  --ok: #3CC48F; --ok-bg: rgba(60,196,143,.15); --warn-bg: rgba(217,138,26,.18); --err-bg: rgba(224,49,63,.18); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body.ar { font-family: var(--font-ar); }
[lang="ar"] { font-family: var(--font-ar); }
* { box-sizing: border-box; }
svg { width: 22px; height: 22px; flex: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.app.full { padding-bottom: 0; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
body.ar .flip { transform: scaleX(-1); }

/* bilingual labels */
.bi { display: flex; flex-direction: column; line-height: 1.25; }
.bi .alt { font-size: .86em; font-weight: 500; color: var(--muted); }
h1 .bi > span:first-child { font-size: 19px; font-weight: 700; color: var(--head); }
h1 .bi .alt { font-size: 17px; font-weight: 600; color: var(--head); }
.sl { opacity: .6; margin-inline: 2px; }
.alt-i { font-weight: inherit; }

/* brand */
.shield { width: 44px; height: 50px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--head); }
.brand b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.3px; line-height: 1.1; }
.brand span { display: block; font-size: 14px; font-weight: 500; }
.brand.lg .shield { width: 64px; height: 74px; }
.brand.lg b { font-size: 30px; }
.brand.lg span { font-size: 17px; }

/* buttons */
.btn { min-height: 50px; border-radius: 12px; border: 0; padding: 0 18px; font-weight: 600; background: var(--btn); color: var(--on-btn); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.alt { background: var(--surface); color: var(--head); border: 1.5px solid var(--line); }
.btn.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.9); border-radius: 99px; }
.btn.social { background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); font-weight: 500; font-size: 14px; }
.btn.danger { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
.btn:disabled { opacity: .5; cursor: default; }
.pillbtn { border: 0; border-radius: 99px; background: var(--btn); color: var(--on-btn); font-size: 13px; font-weight: 600; min-height: 34px; padding: 0 22px; display: block; margin: 10px auto 0; min-width: 62%; }
.link { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 6px 0; font-size: 13px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--head); flex: none; }
.fab { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--btn); color: #fff; display: grid; place-items: center; flex: none; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* topbar */
.topbar { display: flex; align-items: center; gap: 6px; padding-block: 14px 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: 0 1px 2px rgba(10,51,85,.04); }

.empty { text-align: center; padding: 22px 16px; align-items: center; }
.empty svg { width: 36px; height: 36px; color: var(--muted); }

/* home */
.hhead { position: relative; color: #fff; overflow: hidden; padding-block: 18px 54px; min-height: 196px; }
.hhead .sky, .welcome .sky { position: absolute; inset: 0; width: 100%; height: 100%; }

.hhead > * { position: relative; z-index: 1; }
.greet { font-size: 19px; font-weight: 600; line-height: 1.3; }
.greet .alt { color: rgba(255,255,255,.88); font-size: 17px; font-weight: 500; }
.hhead .iconbtn { color: #fff; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #0A3355; font-weight: 700; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.8); flex: none; }
.cpill { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #0A3355; border: 0; border-radius: 99px; padding: 7px 14px 7px 8px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.cpill svg { width: 16px; height: 16px; }
.sheet { position: relative; margin-top: -30px; background: var(--bg); border-radius: 24px 24px 0 0; padding-block: 18px; z-index: 2; }
.fcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 14px; }
.fhead { display: flex; gap: 12px; align-items: flex-start; background: none; border: 0; padding: 0; width: 100%; text-align: start; }
.fhead .bi > span:first-child { font-weight: 700; color: var(--head); font-size: 15px; }
.fhead .bi .alt { color: var(--head); font-size: 14px; font-weight: 600; }
.fdesc { display: block; margin-top: 4px; font-size: 12.5px; }
.fdesc .bi > span:first-child, .fdesc .bi .alt { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.fdot { width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.fdot svg { width: 26px; height: 26px; }
.sect { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--head); }
.card.rem { display: flex; align-items: center; gap: 12px; }
.sq { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.sq svg { width: 22px; height: 22px; }

/* pills */
.pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--amber); background: var(--warn-bg); }
.pill.err { color: var(--red); background: var(--err-bg); }
.pill.mute { color: var(--muted); background: var(--soft); }
.pill.solid-ok { background: var(--green); color: #fff; }
.pill.solid-warn { background: var(--amber); color: #fff; }
.banner { display: flex; gap: 10px; padding: 11px 13px; border-radius: 12px; font-size: 12.5px; background: var(--soft); color: var(--fg); }
.banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--blue); }

/* flags */
.flag { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: inline-grid; flex: none; box-shadow: 0 0 0 1px var(--line); }
.flag svg { width: 100%; height: 100%; }
.flag.sm { width: 22px; height: 22px; }
.flag.lg { width: 44px; height: 44px; }
.plane { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--blue); flex: none; }

/* segmented */
.seg { display: flex; background: var(--soft); border-radius: 99px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 99px; background: transparent; font-weight: 600; font-size: 12.5px; color: var(--muted); line-height: 1.2; }
.seg button.on { background: var(--btn); color: #fff; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 99px; border: 0; background: var(--soft); color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.15; }
.chips button.on { background: var(--btn); color: #fff; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }

/* alerts */
.acard { display: flex !important; gap: 12px; align-items: flex-start; }
.acard .route { font-weight: 700; color: var(--head); font-size: 14.5px; }
.acard .alt { color: var(--muted); font-size: 13px; display: block; }
.meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.meta svg { width: 15px; height: 15px; }
.kv { font-size: 12.5px; color: var(--muted); }
.kv b { color: var(--fg); }

/* forms */
.lbl { font-size: 13px; font-weight: 700; color: var(--head); margin-top: 4px; }
.lbl .sl, .lbl .alt-i { font-weight: 500; color: var(--muted); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select { min-height: 50px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px; width: 100%; font-size: 15px; font-weight: 500; min-width: 0; }
input[type="date"] { direction: ltr; }
.inp { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; color: var(--muted); }
.inp input { border: 0; padding: 0; background: transparent; min-height: 52px; }
.inp input:focus { outline: none; }
.inp:focus-within { border-color: var(--blue); }
.selbox { position: relative; display: flex; align-items: center; }
.selbox .flag { position: absolute; inset-inline-start: 10px; pointer-events: none; }
.selbox .plane { position: absolute; inset-inline-start: 10px; pointer-events: none; width: 24px; height: 24px; }
.selbox .plane svg { width: 14px; height: 14px; }
.selbox select { padding-inline-start: 42px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 50px; padding-inline: 14px 4px; }
.stepper b { flex: 1; font-size: 15px; }
.stepper button { width: 38px; height: 42px; border: 0; background: none; font-size: 20px; color: var(--head); }
.sw { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 13.5px; font-weight: 500; }
.sw .tick { width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
.sw .tick svg { width: 14px; height: 14px; }
.sw span.grow { min-width: 0; }
.sw input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; min-height: 0; border-radius: 99px; background: var(--line); border: 0; padding: 0; position: relative; flex: none; transition: background .15s; }
.sw input::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw input:checked { background: var(--btn); }
.sw input:checked::after { transform: translateX(20px); }
body.ar .sw input:checked::after { transform: translateX(-20px); }
.err-text { color: var(--red); font-size: 13px; }

/* documents */
.dcard { display: flex !important; gap: 14px; align-items: center; }
.dicon { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.dicon svg { width: 26px; height: 26px; }
.dcard h3 { font-size: 15px; color: var(--head); }
.dcard .sub { font-size: 12.5px; color: var(--muted); }
.date-red { color: var(--red); }

/* gratuity */
.steps { display: flex; align-items: flex-start; position: relative; margin-block: 6px 8px; }
.steps::before { content: ""; position: absolute; top: 17px; inset-inline: 16%; height: 2px; background: var(--line); }
.steps div { flex: 1; text-align: center; font-size: 12px; color: var(--muted); position: relative; line-height: 1.25; }
.steps b { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto 6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--line); color: var(--muted); font-size: 13px; }
.steps .on b { background: var(--btn); border-color: var(--btn); color: #fff; }
.steps .on { color: var(--head); font-weight: 600; }
.ccard { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 64px; text-align: start; font-size: 13px; }
.ccard.on { border: 2px solid var(--btn); }
.ccard .bi > span:first-child { font-weight: 600; }
.result { background: var(--navy); color: #fff; border: 0; text-align: center; }
.result .muted { color: rgba(255,255,255,.75); }
.bigamount { font-size: 30px; font-weight: 800; }
.band { position: relative; height: 130px; overflow: hidden; border-radius: 0 0 16px 16px; margin-top: 8px; }
.band .sky { width: 100%; height: 100%; }
.band::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg), transparent 60%); z-index: 1; }
.bar { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }
.check { display: flex; gap: 12px; align-items: flex-start; }
.check input { width: 24px; height: 24px; min-height: 0; margin-top: 2px; accent-color: var(--green); flex: none; }
.confirm { border-color: var(--red); }

/* profile */
.pcard { display: flex; align-items: center; gap: 14px; }
.bigav { width: 76px; height: 76px; border-radius: 50%; background: var(--btn); color: #fff; font-size: 28px; font-weight: 700; display: grid; place-items: center; flex: none; }
.plan { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--warn-bg); color: var(--amber); font-size: 12px; font-weight: 700; margin-top: 6px; }
.plan svg { width: 14px; height: 14px; }
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.menu button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 14px; border: 0; background: none; text-align: start; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.menu button:last-child { border-bottom: 0; }
.menu svg { color: var(--muted); }
.menu .val { font-size: 13px; color: var(--fg); }
.menu.danger button, .menu.danger svg { color: var(--red); }

/* welcome + pre-app */
.app.full { height: 100%; }
.welcome { position: relative; min-height: 100%; color: #fff; overflow: hidden; display: flex; flex-direction: column; }
.welcome::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,40,70,.55) 0%, rgba(6,40,70,.05) 38%, rgba(6,40,70,.1) 55%, rgba(6,40,70,.85) 100%); }
.welcome > *:not(.sky) { position: relative; z-index: 1; }
.welcome .brand { color: #fff; }
.wtop { display: flex; justify-content: flex-end; padding-block: 16px 0; }
.langsw { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.langsw button { background: none; border: 0; padding: 6px 4px; color: inherit; opacity: .7; font-weight: 600; }
.langsw button.on { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.langsw.boxed { border: 1.5px solid var(--line); border-radius: 99px; padding: 2px 12px; color: var(--head); }
.wbrand { padding-block: 34px 0; display: flex; flex-direction: column; gap: 22px; align-items: center; text-align: center; }
.wtag { font-size: 19px; font-weight: 500; line-height: 1.45; }
.wbottom { margin-top: auto; padding-block: 0 26px; display: flex; flex-direction: column; gap: 14px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
.dots i.on { background: #fff; }
.pre { padding-block: 12px 28px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.pre h2 .bi > span:first-child { font-size: 22px; font-weight: 700; color: var(--head); }
.pre h2 .bi .alt { font-size: 20px; color: var(--head); font-weight: 600; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.gmark { font-weight: 800; font-size: 17px; background: linear-gradient(90deg, #4285F4 25%, #EA4335 25% 50%, #FBBC05 50% 75%, #34A853 75%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* tabs */
.tabs { position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 10; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

<script>
// ExpatGuard gratuity engine (same rules and arithmetic as supabase/functions/_shared/gratuity.ts).
const RULES = {
  AE: { status: 'in_review', ref: 'Federal Decree-Law 33/2021, art. 51', src: 'https://uaelegislation.gov.ae/en/legislations/1541/download', eff: '2022-02-02',

  if (!rule || rule.status !== 'in_review' && rule.status !== 'verified') return { available: false, reason: 'rule_unavailable' };
  const p = rule.p; const cur = { QA: 'QAR', AE: 'AED', SA: 'SAR', KW: 'KWD', BH: 'BHD', OM: 'OMR' }[country];
  const s = parseDate(start), e = parseDate(end);

  const years = p.pro === 'months' ? Q(completedMonths(start, end), 12) : Q(days, 365);

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2600); }

const DOC_STYLE = { qatar_id: ['idcard', 'var(--green)'], emirates_id: ['idcard', 'var(--green)'], saudi_iqama: ['idcard', 'var(--green)'], passport: ['doc', 'var(--indigo)'], driving_licence: ['idcard', 'var(--purple)'], residence_permit: ['idcard', 'var(--blue)'], rental_contract: ['doc', 'var(--green)'], insurance: ['doc', 'var(--blue)'], custom: ['doc', 'var(--amber)'] };

function docStatus(d) { const n = daysLeft(d.expiry); return n < 0 ? 'expired' : n <= 30 ? 'soon' : 'valid'; }
function docPill(d) {
  const n = daysLeft(d.expiry); const s = docStatus(d);

const banner = (txt, icon = 'info') => `<div class="banner">${ic(icon)}<span>${txt}</span></div>`;

// ---------- main screens ----------
function fcard(icon, color, titleK, descK, btnK, headA, headV, btnA, btnV) {

function alertStatus(a) { return a.depart < todayISO() ? 'expired' : a.paused ? 'paused' : 'active'; }
function alertCard(a) {
  const s = alertStatus(a);
  const pill = s === 'active' ? `<span class="pill solid-ok">${inlS(T[S.lang].aActive, T[OL()].aActive)}</span>` : s === 'paused' ? `<span class="pill solid-warn">${inlS(T[S.lang].aPaused, T[OL()].aPaused)}</span>` : `<span class="pill mute">${t('aExpired')}</span>`;
  const arrow = (S.lang === 'ar') ? '←' : '→', arrow2 = (S.lang === 'ar') ? '→' : '←';
  return `<button class="card acard" data-a="go" data-v="alertDetail" data-id="${a.id}">${flag(AP_COUNTRY[a.origin])}<span class="grow">
    <span class="row"><span class="route grow">${city(a.origin)} ${arrow} ${city(a.dest)}</span>${pill}</span>
    <bdi class="alt" lang="${OL()}">${city2(a.origin)} ${arrow2} ${city2(a.dest)}</bdi>
    <span class="meta">${ic('clock')}<span class="num">${fmtDate(a.depart)}${a.ret ? ' – ' + fmtDate(a.ret) : ''}</span></span>
    <span class="kv" style="display:block;margin-top:4px">${t('maxL')}: <b class="num">${formatMinor(a.max, a.cur)}</b></span>
    <span class="kv" style="display:block">${t('lastPrice')}: ${t('notYet')}</span></span>${ic('dots', 'muted')}</button>`;
}
function flights() {
  const tabK = V.p.ftab || 'mine';
  const seg = `<div class="seg"><button class="${tabK === 'mine' ? 'on' : ''}" data-a="ftab" data-v="mine">${biS(t('myAlerts'), t2('myAlerts'))}</button><button class="${tabK === 'pop' ? 'on' : ''}" data-a="ftab" data-v="pop">${biS(t('popular'), t2('popular'))}</button></div>`;
  let body;
  if (tabK === 'mine') {
    const list = [...S.alerts].sort((x, y) => ({ active: 0, paused: 1, expired: 2 })[alertStatus(x)] - ({ active: 0, paused: 1, expired: 2 })[alertStatus(y)]);
    body = list.length ? list.map(alertCard).join('') : empty('bell', t('flEmpty'), t('flEmptyT'), `<button class="btn" data-a="go" data-v="newAlert">${inl('createBtn')}</button>`);
  } else {
    const o = HOME_AIRPORT[S.country];
    body = `<p class="muted small">${t('popularT')}</p>` + POPULAR.map((d) => `<button class="card acard" data-a="quickAlert" data-v="${d}">${flag(S.country)}<span class="grow"><span class="route">${city(o)} ${S.lang === 'ar' ? '←' : '→'} ${city(d)}</span><bdi class="alt" lang="${OL()}">${city2(o)} – ${city2(d)}</bdi></span><span class="pill ok">${inlS(t('createAlertShort'), t2('createAlertShort'))}</span></button>`).join('');
  }
  return `<div class="screen">${topbar('flightsTitle', fab('newAlert', 'createAlert'))}<div class="pad stack">${seg}${banner(t('monitorOff'))}${body}</div></div>`;
}
function newAlert(prefill) {
  const f = V.form;
  const opts = (sel) => `<option value="">—</option>` + AIRPORTS.map(([c]) => `<option value="${c}" ${sel === c ? 'selected' : ''}>${airport(c)}</option>`).join('');
  return `<div class="screen">${topbar('createAlert')}
  <form class="pad stack" data-f="createAlert" novalidate style="padding-bottom:20px">
    <div class="lbl">${inl('tripDetails')}</div>
    <div class="grid2"><label class="field">${inl('from')}<span class="selbox">${flag(AP_COUNTRY[f.origin], 'sm')}<select id="a-origin" data-c="alertAp">${opts(f.origin)}</select></span></label>
    <label class="field">${inl('to')}<span class="selbox">${flag(AP_COUNTRY[f.dest], 'sm')}<select id="a-dest" data-c="alertAp">${opts(f.dest)}</select></span></label></div>
    <div class="lbl">${inl('tripType')}</div>
    <div class="seg">${['round', 'oneway'].map((k) => `<button type="button" class="${f.trip === k ? 'on' : ''}" data-a="trip" data-v="${k}">${inl(k)}</button>`).join('')}</div>
    <div class="grid2"><label class="field">${inl('depart')}<input id="a-depart" type="date" value="${f.depart || ''}" min="${todayISO()}"></label>
    ${f.trip === 'round' ? `<label class="field">${inl('ret')}<input id="a-ret" type="date" value="${f.ret || ''}" min="${todayISO()}"></label>` : '<span></span>'}</div>
    <div class="grid2"><label class="field">${inl('passengers')}<span class="stepper"><b class="num">${f.adults}</b><button type="button" data-a="count" data-v="-1" ${f.adults <= 1 ? 'disabled' : ''} aria-label="−">−</button><button type="button" data-a="count" data-v="1" ${f.adults >= 9 ? 'disabled' : ''} aria-label="+">+</button></span></label>
    <label class="field">${inl('cabin')}<select id="a-cabin">${Object.keys(T.en.cabins).map((k) => `<option value="${k}" ${f.cabin === k ? 'selected' : ''}>${t('cabins')[k]} / ${t2('cabins')[k]}</option>`).join('')}</select></label></div>
    <label class="field">${inl('maxPrice')}<span class="row"><input id="a-price" inputmode="decimal" value="${esc(f.price)}" placeholder="1,200" style="flex:2"><select id="a-cur" style="flex:1">${GCC.map(([, c]) => `<option ${f.cur === c ? 'selected' : ''}>${c}</option>`).join('')}</select></span></label>
    <label class="sw"><span class="tick">${ic('check')}</span><span class="grow">${inl('direct')}</span><input type="checkbox" id="a-direct" role="switch" ${f.direct ? 'checked' : ''}></label>
    <label class="sw"><span class="tick">${ic('check')}</span><span class="grow">${inl('flexDates')}</span><input type="checkbox" id="a-flexd" role="switch" ${f.flex ? 'checked' : ''}></label>
    ${errs()}
    <button class="btn" type="submit">${inl('createBtn')}</button>
    <p class="muted small">${t('honesty')}</p>
  </form></div>`;
}
function alertDetail() {
  const a = S.alerts.find((x) => x.id === V.p.id); if (!a) return flights();
  const s = alertStatus(a);

}

    <label class="field">${t('residence')}<select id="d-country">${GCC.map(([c]) => `<option value="${c}" ${f.country === c ? 'selected' : ''}>${cname(c)}</option>`).join('')}</select></label>

    <button class="btn" type="submit">${inl('save')}</button>

  </form></div>`;

function gratuity() {
  const g = V.form; const step = g.step;
  const stepper = `<div class="steps">${['sCountry', 'sJob', 'sResult'].map((k, i) => `<div class="${i <= step ? 'on' : ''}"><b>${i + 1}</b>${biS(t(k), t2(k))}</div>`).join('')}</div>`;
  let body = '';
  if (step === 0) body = `<div class="lbl">${inl('selCountry')}</div><div class="grid2">${GCC.map(([c]) => `<button class="ccard ${g.country === c ? 'on' : ''}" data-a="gCountry" data-v="${c}">${flag(c)}${biS(cname(c), cname2(c))}</button>`).join('')}</div><button class="btn" data-a="gStep" data-v="1" style="margin-top:8px">${inl('next')}</button><div class="band">${skyline()}</div>`;
  if (step === 1) {
    const cur = CUR[g.country];
    body = `<form class="stack" data-f="gCalc" novalidate><div class="row">${flag(g.country)}<b>${cname(g.country)}</b></div>
      <div class="grid2"><label class="field">${t('startD')}<input id="g-start" type="date" value="${g.start || ''}" min="1980-01-01"></label>
      <label class="field">${t('endD')}<input id="g-end" type="date" value="${g.end || ''}"></label></div>
      <label class="field">${g.country === 'SA' ? t('last') : t('basic')} (${cur})<input id="g-wage" inputmode="decimal" value="${esc(g.wage)}"></label>
      ${g.country === 'BH' ? `<label class="field">${t('social')} (${cur})<input id="g-social" inputmode="decimal" value="${esc(g.social)}"></label>` : ''}
      <p class="muted small">${t('salaryNote')}</p>
      <label class="field">${t('reason')}<select id="g-reason">${[['termination', 'rTerm'], ['contract_end', 'rEnd'], ['resignation', 'rResign']].map(([k, l]) => `<option value="${k}" ${g.reason === k ? 'selected' : ''}>${t(l)}</option>`).join('')}</select></label>
      ${errs()}
      <div class="grid2"><button type="button" class="btn alt" data-a="gStep" data-v="0">${inl('back')}</button><button class="btn" type="submit">${inl('calc')}</button></div></form>`;
  }
  if (step === 2) {
    const r = g.result;
    if (!r.available) body = `${empty('calc', t('unavailT'), r.reason === 'resignation_unconfirmed' ? t('resignU') : t('unavailM'))}<button class="btn alt" data-a="gStep" data-v="${r.reason === 'rule_unavailable' ? 0 : 1}">${inl('back')}</button>`;
    else body = `${r.confirmed ? '' : banner(t('toConfirm'))}
      <div class="card result stack" style="gap:6px;padding:22px"><span class="muted">${inl('estimated')}</span><span class="bigamount num">${r.eligible ? formatMinor(r.amount, r.currency) : t('notElig')}</span><span class="muted small">${fill(t('service'), { y: r.years, d: r.days })}</span></div>
      <div class="lbl">${t('how')}</div><div class="card stack" style="gap:8px">${r.steps.map(([k, p]) => `<div class="row small num" style="align-items:flex-start"><span style="color:var(--green)">✓</span><span class="grow">${fill(t('st')[k], p)}</span></div>`).join('')}</div>
      ${r.warnings.map((w) => banner(t(w === 'sio' ? 'wSio' : 'wBefore'))).join('')}
      <div class="lbl">${t('legal')}</div><p class="small">${r.ref}</p><a class="link" href="${r.src}" target="_blank" rel="noopener">${t('source')} ↗</a>
      <p class="muted small">${t('disclaimer')}</p><button class="btn alt" data-a="gStep" data-v="1">${t('edit')}</button>`;
  }
  return `<div class="screen">${topbar('gratTitle')}<div class="pad stack" style="padding-bottom:16px">${stepper}${body}</div></div>`;
}

function guide() {
  if (!V.p.country) {
    return `<div class="screen">${topbar('guideTitle')}<div class="pad stack"><p class="muted small">${t('guideIntro')}</p>
      ${GCC.map(([c]) => { const done = (S.guide[c] || []).length; return `<button class="card acard" data-a="guideCountry" data-v="${c}">${flag(c)}<span class="grow">${biS(cname(c), cname2(c))}<span class="small muted">${fill(t('progress'), { d: done, t: 5 })}</span></span>${ic('chev', 'flip muted')}</button>`; }).join('')}</div></div>`;
  }
  const c = V.p.country, done = S.guide[c] || [];
  return `<div class="screen">${topbar('guideTitle')}<div class="pad stack"><div class="row">${flag(c)}<b>${cname(c)}</b></div>
    <span class="small">${fill(t('progress'), { d: done.length, t: 5 })}</span><div class="bar"><i style="width:${done.length * 20}%"></i></div>
    ${t('guideSteps').map((s, i) => `<label class="card check"><input type="checkbox" data-c="guideTick" data-v="${i}" ${done.includes(i) ? 'checked' : ''}><span class="grow"><b>${i + 1}. ${s}</b></span></label>`).join('')}
    ${banner(t('guideVerify'))}</div></div>`;
}
function notifications() { return `<div class="screen">${topbar('notifTitle')}<div class="pad stack">${empty('bell', t('notifEmpty'), t('notifEmptyT'))}</div></div>`; }

function profile() {
  const item = (icon, k, a, v = '', val = '') => `<button data-a="${a}" data-v="${v}">${ic(icon)}<span class="grow">${bi(k)}</span>${val ? `<span class="val">${val}</span>` : ''}${ic('chev', 'flip muted')}</button>`;
  return `<div class="screen">${topbar('profile')}<div class="pad stack">
    <button class="card pcard" data-a="go" data-v="personal"><span class="bigav">${initials()}</span><span class="grow"><b style="font-size:18px;color:var(--head)">${esc(S.name || t('guest'))}</b><span class="small muted" style="display:block">${esc(S.email || t('guestMail'))}</span><span class="plan">${ic('star')}${inlS(t('freePlan'), t2('freePlan'))}</span></span>${ic('chev', 'flip muted')}</button>
    <div class="menu">${item('user', 'personal', 'go', 'personal')}${item('globe', 'countryCur', 'go', 'countrySel', `${CUR[S.country]}`)}${item('globe', 'language', 'toggleLang', '', t('langName'))}${item('bell', 'notifSet', 'go', 'notifications')}${item('help', 'help', 'go', 'help')}${item('info', 'aboutApp', 'go', 'help')}</div>
    <div class="menu danger"><button data-a="logout">${ic('logout')}<span class="grow">${bi('logOut')}</span></button></div>
  </div></div>`;
}
function personal() {
  return `<div class="screen">${topbar('personal')}<form class="pad stack" data-f="savePersonal" novalidate>
    <label class="field">${inl('yourName')}<input id="p-name" maxlength="40" value="${esc(S.name)}" autocomplete="given-name"></label>
    <label class="field">${inl('email')}<input id="p-email" type="email" maxlength="80" value="${esc(S.email)}" autocomplete="email"></label>
    <label class="field">${inl('homeCountry')}<select id="p-home"><option value="">${t('notSet')}</option>${Object.entries(t('hcountries')).map(([c, n]) => `<option value="${c}" ${S.home === c ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <p class="muted small">${t('guestHint')}</p><button class="btn" type="submit">${inl('save')}</button></form></div>`;
}
function countrySel() {
  return `<div class="screen">${topbar('countryCur')}<div class="pad stack"><div class="lbl">${inl('whereLive')}</div><div class="grid2">${GCC.map(([c, cur]) => `<button class="ccard ${S.country === c ? 'on' : ''}" data-a="pickCountry" data-v="${c}">${flag(c)}<span class="grow">${biS(cname(c), cname2(c))}<span class="small muted">${cur}</span></span></button>`).join('')}</div></div></div>`;
}
function help() {
  return `<div class="screen">${topbar('help')}<div class="pad stack">
    <div class="card stack" style="gap:8px">${brand()}<p class="small">${t('aboutT')}</p></div>
    <div class="card stack" style="gap:8px"><b style="color:var(--head)">${t('privacy')}</b><p class="small">${t('privacyT')}</p></div>
    <button class="card acard" data-a="go" data-v="guide"><span class="sq" style="--c:var(--amber)">${ic('list')}</span><span class="grow">${bi('guideCard')}</span>${ic('chev', 'flip muted')}</button>
    ${V.confirm ? `<div class="card confirm stack"><h3>${t('confirmDel')}</h3><div class="grid2"><button class="btn alt" data-a="cancelDel">${t('cancel')}</button><button class="btn danger" data-a="resetAll">${t('yesDel')}</button></div></div>` : `<button class="btn danger" data-a="askDel">${t('reset')}</button>`}
  </div></div>`;
}

// ---------- render & events ----------
const SCREENS = { docForm, newAlert, alertDetail, gratuity, guide, notifications, personal, countrySel, help };
function render() {
  document.documentElement.lang = S.lang; document.documentElement.dir = t('dir');
  document.body.classList.toggle('ar', S.lang === 'ar'); document.title = 'ExpatGuard';
  const app = document.getElementById('app'), tabs = document.getElementById('tabs');
  skyN = 0;
  if (!S.onboarded) { app.classList.add('full'); app.innerHTML = { welcome, login, setup }[V.pre](); tabs.hidden = true; return; }
  app.classList.remove('full'); tabs.hidden = false;
  app.innerHTML = V.screen ? SCREENS[V.screen]() : { home, flights, docs: documents, profile }[V.tab]();
  tabs.innerHTML = `<div class="in">${[['home', 'home', 'tabHome'], ['flights', 'flight', 'tabFlights'], ['docs', 'doc', 'tabDocs'], ['profile', 'user', 'tabProfile']].map(([k, i, l]) => { const on = !V.screen && V.tab === k; return `<button class="tab ${on ? 'on' : ''}" data-a="tab" data-v="${k}" aria-current="${on ? 'page' : 'false'}">${ic(i)}<span>${t(l)}</span><span class="alt2" lang="${OL()}">${t2(l)}</span></button>`; }).join('')}</div>`;
}
function go(screen, p = {}) {
  V = { ...V, screen, p, err: [], confirm: false };
  if (screen === 'docForm') {
    const d = S.docs.find((x) => x.id === p.id);
    V.form = d ? { ...d, country: docCountry(d), offsets: [...d.offsets] } : { id: null, type: 'qatar_id', name: t('types').qatar_id, country: S.country, expiry: '', offsets: [90, 30, 7, 1], notes: '' };
  }
  if (screen === 'newAlert') V.form = { origin: HOME_AIRPORT[S.country], dest: p.dest || '', trip: 'round', depart: '', ret: '', flex: 0, adults: 1, children: 0, cabin: 'economy', price: '', cur: CUR[S.country], direct: true, nb: true, nd: false };
  if (screen === 'gratuity') V.form = { step: 0, country: S.country, start: '', end: '', wage: '', social: '', reason: 'termination', result: null };
  render(); window.scrollTo(0, 0);
}
function readAlertForm() {
  const f = V.form, v = (id) => document.getElementById(id)?.value ?? '';
  Object.assign(f, { origin: v('a-origin'), dest: v('a-dest'), depart: v('a-depart'), ret: f.trip === 'round' ? v('a-ret') : '', cabin: v('a-cabin'), price: v('a-price'), cur: v('a-cur'),
    direct: document.getElementById('a-direct').checked, flex: document.getElementById('a-flexd').checked ? 3 : 0 });
}
function readGratForm() {
  const g = V.form, v = (id) => document.getElementById(id)?.value ?? '';
  Object.assign(g, { start: v('g-start'), end: v('g-end'), wage: v('g-wage'), social: v('g-social'), reason: v('g-reason') });
}
function readDocForm() { const d = V.form, v = (id) => document.getElementById(id).value; Object.assign(d, { type: v('d-type'), name: v('d-name'), country: v('d-country'), expiry: v('d-exp'), notes: v('d-notes') }); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'tab') { V = { ...V, tab: v, screen: null, p: {}, confirm: false }; render(); window.scrollTo(0, 0); }
  else if (a === 'go') go(v, { id: el.dataset.id });
  else if (a === 'back') {
    if (V.screen === 'guide' && V.p.country) { V.p = {}; render(); }
    else if (V.screen) { V.screen = null; V.confirm = false; render(); }
    else { V.tab = 'home'; V.p = {}; render(); }
    window.scrollTo(0, 0);
  }
  else if (a === 'pre') { if (V.pre === 'setup') S.name = document.getElementById('s-name')?.value.trim() ?? S.name; V.pre = v; V.loginMsg = false; render(); window.scrollTo(0, 0); }
  else if (a === 'soon') { V.loginMsg = true; render(); }
  else if (a === 'setupCountry') { S.name = document.getElementById('s-name').value.trim(); S.country = v; persist(); render(); }
  else if (a === 'finishSetup') { S.name = document.getElementById('s-name').value.trim(); S.home = document.getElementById('s-home').value || null; S.onboarded = true; V.tab = 'home'; V.screen = null; persist(); render(); window.scrollTo(0, 0); }
  else if (a === 'setLang') { if (V.pre === 'setup' && !S.onboarded) S.name = document.getElementById('s-name')?.value.trim() ?? S.name; S.lang = v; persist(); render(); }
  else if (a === 'toggleLang') { S.lang = S.lang === 'en' ? 'ar' : 'en'; persist(); render(); }
  else if (a === 'logout') { S.onboarded = false; V.pre = 'welcome'; persist(); render(); window.scrollTo(0, 0); }
  else if (a === 'pickCountry') { S.country = v; persist(); V.screen = null; render(); toast(t('saved')); }
  else if (a === 'ftab') { V.p = { ftab: v }; render(); }
  else if (a === 'dc') { V.p = { dc: v }; render(); }
  else if (a === 'quickAlert') go('newAlert', { dest: v });
  else if (a === 'toggleOffset') { readDocForm(); const n = +v; V.form.offsets = V.form.offsets.includes(n) ? V.form.offsets.filter((x) => x !== n) : [...V.form.offsets, n].sort((x, y) => y - x); render(); }
  else if (a === 'askDel') { V.confirm = true; if (V.screen === 'docForm') readDocForm(); render(); }
  else if (a === 'cancelDel') { V.confirm = false; render(); }
  else if (a === 'delDoc') { S.docs = S.docs.filter((d) => d.id !== V.form.id); persist(); V.screen = null; V.tab = 'docs'; V.confirm = false; render(); }
  else if (a === 'delAlert') { S.alerts = S.alerts.filter((x) => x.id !== V.p.id); persist(); V.screen = null; V.tab = 'flights'; V.confirm = false; render(); }
  else if (a === 'pauseAlert') { const x = S.alerts.find((y) => y.id === V.p.id); x.paused = !x.paused; persist(); render(); }
  else if (a === 'resetAll') { S = { ...DEFAULT, lang: S.lang, country: S.country, name: S.name, onboarded: true }; persist(); V.confirm = false; render(); toast(t('resetDone')); }
  else if (a === 'trip') { readAlertForm(); V.form.trip = v; render(); }
  else if (a === 'count') { readAlertForm(); V.form.adults = Math.min(9, Math.max(1, V.form.adults + +v)); render(); }
  else if (a === 'gCountry') { V.form.country = v; render(); }
  else if (a === 'gStep') { if (V.form.step === 1) readGratForm(); V.form.step = +v; V.err = []; render(); window.scrollTo(0, 0); }
  else if (a === 'guideCountry') { V.p = { country: v }; render(); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-c]'); if (!el) return;
  const c = el.dataset.c;
  if (c === 'docType') { const nameEl = document.getElementById('d-name'); if (!nameEl.value || Object.values(t('types')).includes(nameEl.value)) nameEl.value = t('types')[el.value]; if (TYPE_COUNTRY[el.value]) document.getElementById('d-country').value = TYPE_COUNTRY[el.value]; }
  else if (c === 'alertAp') { readAlertForm(); render(); }
  else if (c === 'guideTick') { const c2 = V.p.country, i = +el.dataset.v; const cur = new Set(S.guide[c2] || []); el.checked ? cur.add(i) : cur.delete(i); S.guide[c2] = [...cur].sort(); persist(); render(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target.dataset.f;
  if (f === 'login') { V.loginMsg = true; render(); }
  if (f === 'savePersonal') { S.name = document.getElementById('p-name').value.trim(); S.email = document.getElementById('p-email').value.trim(); S.home = document.getElementById('p-home').value || null; persist(); V.screen = null; render(); toast(t('saved')); }
  if (f === 'saveDoc') {
    readDocForm(); const d = V.form; d.name = d.name.trim(); d.notes = d.notes.trim();
    V.err = []; if (!d.name) V.err.push(t('errName')); if (!/^\d{4}-\d{2}-\d{2}$/.test(d.expiry)) V.err.push(t('errExpiry'));
    if (V.err.length) return render();
    const rec = { id: d.id || uid(), type: d.type, name: d.name, country: d.country, expiry: d.expiry, offsets: d.offsets, notes: d.notes };
    S.docs = [...S.docs.filter((x) => x.id !== rec.id), rec]; persist(); V.screen = null; V.tab = 'docs'; render(); toast(t('saved'));
  }
  if (f === 'createAlert') {
    readAlertForm(); const a = V.form; V.err = [];
    if (!a.origin) V.err.push(t('eOrigin')); if (!a.dest) V.err.push(t('eDest')); if (a.origin && a.origin === a.dest) V.err.push(t('eSame'));
    if (!a.depart || a.depart < todayISO()) V.err.push(t('eDepart')); if (a.trip === 'round' && (!a.ret || a.ret < a.depart)) V.err.push(t('eReturn'));
    const m = toMinor(a.price, a.cur); if (m === null || m <= 0n) V.err.push(t('ePrice'));
    if (V.err.length) return render();
    S.alerts.unshift({ id: uid(), origin: a.origin, dest: a.dest, trip: a.trip, depart: a.depart, ret: a.ret || null, flex: a.flex, adults: a.adults, children: 0, cabin: a.cabin, max: String(m), cur: a.cur, direct: a.direct, nb: true, nd: false, paused: false });
    persist(); V = { ...V, tab: 'flights', screen: null, p: {} }; render(); window.scrollTo(0, 0); toast(t('alertCreated'));
  }
  if (f === 'gCalc') {
    readGratForm(); const g = V.form; V.err = []; const cur = CUR[g.country];
    if (!g.start || !g.end || g.end <= g.start) V.err.push(t('eDates'));
    const wage = toMinor(g.wage, cur); if (wage === null || wage <= 0n) V.err.push(t('eWage'));
    const social = g.country === 'BH' ? toMinor(g.social || '0', cur) : 0n; if (social === null) V.err.push(t('eWage'));
    if (V.err.length) return render();
    try { g.result = calculateGratuity(g.country, g.start, g.end, wage, social, g.reason); g.step = 2; } catch { V.err.push(t('eDates')); }
    render(); window.scrollTo(0, 0);
  }
});
render();
</script>

</body></html>
